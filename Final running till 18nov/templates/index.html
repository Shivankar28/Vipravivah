    <nav class="navbar">

            <div class="form-group">

                    <option value="" disabled selected>Min Age</option>
                    <!-- Age Options -->
                    <option value="21">21</option>

                    <option value="26">26</option>

                    <option value="34">34</option>
                    <option value="35">35</option>
                    <option value="36">36</option>
                    <option value="37">37</option>
                    <option value="38">38</option>
                    <option value="39">39</option>
                    <option value="40">40</option>
                    <option value="41">41</option>

                </select>
                <label for="age_max">to</label>
                <select id="age_max" name="age_max" required>
                    <option value="" disabled selected>Max Age</option>
                    <!-- Age Options -->
                    <option value="21">21</option>
                    <option value="22">22</option>
                    <option value="23">23</option>
                    <option value="24">24</option>
                    <option value="25">25</option>
                    <option value="26">26</option>
                    <option value="27">27</option>
                    <option value="28">28</option>
                    <option value="29">29</option>
                    <option value="30">30</option>
                    <option value="31">31</option>
                    <option value="32">32</option>
                    <option value="33">33</option>
                    <option value="34">34</option>
                    <option value="35">35</option>
                    <option value="36">36</option>
                    <option value="37">37</option>
                    <option value="38">38</option>
                    <option value="39">39</option>
                    <option value="40">40</option>
                    <option value="41">41</option>
                    <!-- Add other age options as needed -->
                </select>
            </div>

            <div class="form-group">
                <label for="mother_tongue">Mother Tongue</label>
                <select id="mother_tongue" name="mother_tongue" required>
                    <option value="" disabled selected>Select</option>
                    <option value="hindi">Hindi</option>
                    <option value="bengali">Bengali</option>
                    <option value="marathi">Marathi</option>
                    <option value="tamil">Tamil</option>
                    <option value="telugu">Telugu</option>
                    <option value="gujarati">Gujarati</option>
                    <option value="kannada">Kannada</option>
                    <option value="odia">Odia</option>
                    <option value="malayalam">Malayalam</option>
                    <option value="punjabi">Punjabi</option>
                    <!-- Add more languages as needed -->
                </select>
            </div>

            <div class="form-group">
                <label for="gotra">Gotra</label>
                <select id="gotra" name="gotra" required>
                    <option value="" disabled selected>Select Gotra</option>
                    <option value="kashyap">Kashyap</option>
                    <option value="bharadwaj">Bharadwaj</option>
                    <option value="vishwamitra">Vishwamitra</option>
